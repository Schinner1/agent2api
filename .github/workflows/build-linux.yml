name: Extract and Release Linux Binary

on:
  workflow_dispatch: 
  push:
    tags:
      - 'v*'         

jobs:
  extract-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Pull Official Docker Image
        run: |
          docker pull aimodcc/agent2api:latest

      - name: Extract Binary from Image
        run: |
          echo "📦 正在无损解包提取核心文件..."
          # 启动镜像并导出完整文件系统
          CID=$(docker create aimodcc/agent2api:latest)
          docker export $CID -o container.tar
          mkdir rootfs && tar -xf container.tar -C rootfs
          
          mkdir -p ./release_assets
          
          # 智能搜索：全局寻找文件名包含 agent2api 的可执行程序（100%精准）
          REAL_BIN=$(find ./rootfs -type f -executable -name "*agent2api*" | head -n 1)
          
          # 防呆机制：如果作者连名字都改了，就找大于 2MB 的主程序
          if [ -z "$REAL_BIN" ]; then
             REAL_BIN=$(find ./rootfs -type f -executable -size +2M | head -n 1)
          fi
          
          echo "🎯 成功锁定并提取核心程序: $REAL_BIN"
          cp "$REAL_BIN" ./release_assets/agent2api-linux-amd64
          
          cd ./release_assets
          chmod +x agent2api-linux-amd64
          # 打包成标准 tar.gz
          tar -czvf agent2api-linux-amd64.tar.gz agent2api-linux-amd64
          
          echo "📊 最终打包文件大小："
          ls -lh agent2api-linux-amd64.tar.gz

      - name: Upload Artifact (For Manual Run)
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: agent2api-linux-amd64
          path: ./release_assets/agent2api-linux-amd64.tar.gz

      - name: Publish GitHub Release (For Tag Push)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./release_assets/agent2api-linux-amd64.tar.gz
          generate_release_notes: true
