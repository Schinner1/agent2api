name: Extract and Release Linux Binary

on:
  workflow_dispatch: # 依然支持手动触发
  push:
    tags:
      - 'v*'         # 依然支持 Tag 自动触发发布

jobs:
  extract-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Pull Official Docker Image
        run: |
          echo "⬇️ 正在拉取原作者编译好的最新版 Docker 镜像..."
          docker pull aimodcc/agent2api:latest

      - name: Extract Binary from Image
        run: |
          echo "📦 正在无损解包提取核心文件..."
          # 创建临时容器（无需运行）
          docker create --name temp-container aimodcc/agent2api:latest
          
          # 导出容器的完整 Linux 文件系统
          docker export temp-container -o container.tar
          mkdir rootfs
          tar -xf container.tar -C rootfs
          
          mkdir -p ./release_assets/agent2api-linux
          
          # 智能提取：将作者存放在 /app 目录下的核心程序与前端静态文件全部提取出来
          if [ -d "./rootfs/app" ]; then
            cp -r ./rootfs/app/* ./release_assets/agent2api-linux/
          else
            # 防呆设计：如果不在常规目录，自动找出大于 5MB 的独立编译可执行文件
            find ./rootfs -type f -executable -size +5M -exec cp {} ./release_assets/agent2api-linux/ \;
          fi
          
          # 打包为压缩包
          cd ./release_assets
          tar -czvf agent2api-linux-amd64.tar.gz ./agent2api-linux

      - name: Upload Artifact (For Manual Run)
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: agent2api-linux-amd64
          path: ./release_assets/agent2api-linux-amd64.tar.gz

      - name: Publish GitHub Release (For Tag Push)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./release_assets/agent2api-linux-amd64.tar.gz
          generate_release_notes: true
