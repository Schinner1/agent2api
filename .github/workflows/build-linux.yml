name: Extract and Release Linux Binary

on:
  workflow_dispatch: 

jobs:
  extract-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🔍 获取官方最新版本号
        id: get_version
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/aimod-cc/agent2api/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v-auto-${{ github.run_number }}"
          fi
          echo "TAG_NAME=$LATEST_TAG" >> $GITHUB_ENV

      - name: ⬇️ 拉取官方最新 Docker 镜像
        run: |
          docker pull aimodcc/agent2api:latest

      - name: 📦 无损解包提取核心文件
        run: |
          CID=$(docker create aimodcc/agent2api:latest)
          docker export $CID -o container.tar
          mkdir rootfs && tar -xf container.tar -C rootfs
          
          mkdir -p release_assets
          
          REAL_BIN=$(find ./rootfs -type f -executable -name "*agent2api*" | head -n 1)
          if [ -z "$REAL_BIN" ]; then
             REAL_BIN=$(find ./rootfs -type f -executable -size +2M | head -n 1)
          fi
          
          cp "$REAL_BIN" release_assets/agent2api-linux-amd64
          
          cd release_assets
          chmod +x agent2api-linux-amd64
          tar -czvf agent2api-linux-amd64.tar.gz agent2api-linux-amd64

      - name: 🚀 自动发布到 Releases 页面
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}-b${{ github.run_number }}
          name: Agent2API Linux ${{ env.TAG_NAME }}
          body: |
            🚀 **Linux 纯净版服务端自动提取包**
            
            - **对应官方版本**: `${{ env.TAG_NAME }}`
            - **提取来源**: 官方最新 Docker 镜像 `aimodcc/agent2api:latest`
            - **适用环境**: 无法使用 Docker 的 LXC / 纯净 Linux (AMD64)
            - **文件体积**: 约 4.1 MB
            
            ### 💡 如何在小鸡上使用？
            SSH 连接到你的服务器，依次复制执行以下命令：
            
            ```bash
            # 1. 下载并解压
            wget https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}-b${{ github.run_number }}/agent2api-linux-amd64.tar.gz
            tar -xzvf agent2api-linux-amd64.tar.gz
            
            # 2. 挂后台运行 (会自动释放数据到当前目录的 data 文件夹)
            nohup ./agent2api-linux-amd64 > agent2api.log 2>&1 &
