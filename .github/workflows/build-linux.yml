name: Extract and Release Linux Binary

on:
  workflow_dispatch: 

jobs:
  extract-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. 核心修复：检出代码，生成 .git 目录供 gh 识别仓库
      - name: 检出仓库代码环境
        uses: actions/checkout@v4

      - name: 🔍 获取官方最新版本号
        id: get_version
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/aimod-cc/agent2api/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v-auto-${{ github.run_number }}"
          fi
          echo "TAG_NAME=$LATEST_TAG" >> $GITHUB_ENV

      - name: ⬇️ 拉取官方最新 Docker 镜像
        run: |
          docker pull aimodcc/agent2api:latest

      - name: 📦 无损解包提取核心文件并打包
        run: |
          CID=$(docker create aimodcc/agent2api:latest)
          docker export $CID -o container.tar
          mkdir rootfs && tar -xf container.tar -C rootfs
          
          mkdir -p release_assets
          
          REAL_BIN=$(find ./rootfs -type f -executable -name "*agent2api*" | head -n 1)
          if [ -z "$REAL_BIN" ]; then
             REAL_BIN=$(find ./rootfs -type f -executable -size +2M | head -n 1)
          fi
          
          echo "🎯 成功抓取核心程序: $REAL_BIN"
          cp "$REAL_BIN" release_assets/agent2api-linux-amd64
          chmod +x release_assets/agent2api-linux-amd64
          
          tar -czvf release_assets/agent2api-linux-amd64.tar.gz -C release_assets agent2api-linux-amd64
          
          echo "📊 确认压缩包已在本地生成："
          ls -lh release_assets/agent2api-linux-amd64.tar.gz

      - name: 🚀 使用 GitHub 原生 CLI 强制创建 Release 并挂载附件
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. 动态生成说明文档
          cat << 'EOF' > release_notes.md
          🚀 **Linux 纯净版服务端自动提取包**

          - **对应官方版本**: ${{ env.TAG_NAME }}
          - **提取来源**: 官方最新 Docker 镜像 `aimodcc/agent2api:latest`
          - **适用环境**: 无法使用 Docker 的 LXC / 纯净 Linux (AMD64)
          - **文件体积**: 约 4.1 MB

          ### 💡 如何在小鸡上使用？
          SSH 连接到你的服务器，依次复制执行以下命令：

          ```bash
          # 1. 下载并解压
          wget https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}-b${{ github.run_number }}/agent2api-linux-amd64.tar.gz
          tar -xzvf agent2api-linux-amd64.tar.gz

          # 2. 挂后台运行 (会自动释放数据到当前目录的 data 文件夹)
          nohup ./agent2api-linux-amd64 > agent2api.log 2>&1 &
          ```
          > 启动后，直接浏览器访问 `http://你的IP:3065` 即可打开面板。
          EOF

          # 2. 明确加上 --repo 参数，强制绑定当前仓库发布
          gh release create "${{ env.TAG_NAME }}-b${{ github.run_number }}" \
            release_assets/agent2api-linux-amd64.tar.gz \
            --repo "${{ github.repository }}" \
            --title "Agent2API Linux ${{ env.TAG_NAME }}" \
            --notes-file release_notes.md
